openapi: 3.0.3

info:
  title: My API
  description: API Documentation
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production Server

tags:
  - name: Users
    description: User management

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"

      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer

      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "404":
          description: User not found

components:
  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: Nguyen Van A

        email:
          type: string
          format: email
          example: nguyenvana@example.com

    CreateUser:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Nguyen Van A

        email:
          type: string
          format: email
          example: nguyenvana@example.com
